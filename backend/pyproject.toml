[project]
name = "presentation-timer-backend"
version = "0.2.0"
description = "Presentation Timer & Speech/Pause Analyzer Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic[email]",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2]",
    "asyncpg",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyrefly",
    "httpx",
    "hypothesis>=6.0",
    "pytest-cov>=7.1.0",
]

[tool.pyrefly]
project-includes = ["app", "tests/unit"]
preset = "all"
python-version = "3.14"
site-package-path = [".venv/lib/python3.14/site-packages"]

[[tool.pyrefly.sub-config]]
matches = "**/models.py"

[tool.pyrefly.sub-config.errors]
explicit-any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "ASYNC",
    "S", "TRY", "RET", "ARG", "PTH", "PIE", "A", "T20", "LOG", "G",
    "DTZ", "BLE", "EM", "ISC", "INP", "SLF", "FA", "ICN", "PGH", "PL",
    "PT", "YTT", "FLY", "FAST", "C90", "FURB", "ANN",
]
ignore = [
    "B008",
    "TRY003",
    "TRY301",
    "S101",
    "S105", "S106",
    "PLC0415",
    "EM101",
    "INP001",
    "PLR2004",
    "PLR0917",
    "RUF001", "RUF002", "RUF003",
    "ISC001",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "SLF001",
    "ARG",
    "ANN",
    "PLR0913",
    "T20",
]